[project]
name = "wilcus-vault"
version = "0.0.1"
description = "Files-are-truth markdown memory vault for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "sqlite-vec==0.1.7a2",
  "pyyaml>=6.0",
  "watchfiles>=1.0",
]

[project.scripts]
vault = "wilcus_vault.cli:entrypoint"

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wilcus_vault"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["sqlite_vec"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=tmp-test -q"
